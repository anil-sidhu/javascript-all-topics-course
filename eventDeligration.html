<!DOCTYPE html>
<html lang="en">
<head>
    <title>Event Delegation Demo</title>
    <style>
        body {
            font-family: Arial;
        }
        #parent {
            padding: 20px;
            border: 2px solid #333;
            width: 300px;
        }
        .btn {
            display: block;
            margin: 10px 0;
            padding: 10px;
            cursor: pointer;
            background: lightblue;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Event Delegation Example</h2>

    <div onclick="handleParent(event)" id="parent">
        <button  class="btn">Button 1</button>
        <button class="btn">Button 2</button>
        <button  class="btn">Button 3</button>
    </div>

    <script>
      
      function handleParent(event){
        if(event.target.classList.contains("btn")){
        // console.log(event.target.innerText)
        let btn=event.target.innerText;
        if(btn=="Button 1"){
            one()
        }else if(btn=="Button 2"){
            two()
        }else if(btn=="Button 3"){
            three()
        }
        
      }
    }
function one(){
    console.log("one")
}
      
function two(){
    console.log("two")
}
function three(){
    console.log("three")
}
    </script>

</body>
</html>
