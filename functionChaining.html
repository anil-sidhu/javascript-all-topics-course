<!DOCTYPE html>
<html lang="en">

<head>
  <title>Function Chaining</title>
  <style>

  </style>
</head>

<body>
  <h1 id="heading"></h1>
  <script>
    const obj = {
      value: 0,
      add(a) {
        this.value += a
        return this
      },
      sub(a) {
        this.value -= a
        return this
      },
      mul(a) {
        this.value *= a
        return this
      },
      print() {
        return this.value
      }
    }
    console.log(obj.add(100).sub(5).mul(10).print());
    
  </script>
</body>

</html>
