<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Try catch </title>
</head>

<body>
    <h1>Try catch with async await in JavaScript</h1>
    <button onclick="abortCall()">Abort Request</button>
    <button onclick="apiCall()">Abort Request</button>

    <script>



        const controller = new AbortController();
        const signal = controller.signal;


        function abortCall() {
            controller.abort();
        }

        async function apiCall() {

            try {
                const url2 = "https://jsonplaceholder.typicode.com/posts/";
                let response2 = await fetch(url2, { signal });
                response2 = await response2.json();
                console.log(response2);

            } catch (error) {
                console.log(error.message);

            }
        }

        // apiCall()
    </script>
</body>

</html>
