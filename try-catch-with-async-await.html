<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Try catch </title>
</head>

<body>
    <h1>Try catch with async await in JavaScript</h1>
    <script>
        async function apiCall() {

            try {
                const url = "https://jsonplaceholder.typicode.co/posts/1";
                let response = await fetch(url);
                response = await response.json();
                console.log(response);

                alert("first api call done")



            } catch (error) {
                console.log(error.message);
                alert(error.message + " please check url and other params in first api")

            }finally{
                console.log("clean your data o close loader for 1st api")
            }


            try {
                const url2 = "https://jsonplaceholder.typicode.co/posts/";
                let response2 = await fetch(url2);
                response2 = await response2.json();
                console.log(response2);
                alert("second api call done")



            } catch (error) {
                console.log(error.message);
                alert(error.message + " please check url and other params in second api")

            }

        }

        apiCall()
    </script>
</body>

</html>
