<!DOCTYPE html>
<html lang="en">

<head>
    <title>Anonymous function</title>
</head>

<body>
    <h1>Anonymous Function</h1>
    <script>
        // add()
        const add = function(a,b){
            return a+b  
        }

        const sub=function(a,b){
            return a-b
        }

        // add()

       function operations(fun){
        let x=10;
        let y=20
        console.log(fun(x,y));
        
        
       }
       operations(add)
       operations(sub)

       const onTime=function(){
        console.log("on time called");
        
       }

       setTimeout(onTime, 2000);

    </script>
</body>

</html>
