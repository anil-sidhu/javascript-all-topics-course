<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3 Buttons — Alert Names</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f6f8fa;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Click a button</h1>
        <div class="buttons">
            <button id="btn1" onclick="" type="button">Anil</button>
            <button id="btn2" type="button">Sam</button>
            <button id="btn3" type="button">Peter</button>
        </div>
    </div>

    <script>
        // Map button ids to names
        const names = {
            btn1: 'Anil',
            btn2: 'Sam',
            btn3: 'Peter'
        };

        // Attach click handlers
        Object.keys(names).forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                alert('Hello, How are you ' + names[id] + '!');
            });
        });
    </script>
</body>

</html>
